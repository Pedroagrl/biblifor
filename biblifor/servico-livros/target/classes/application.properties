server.port=8081
spring.application.name=servico-livros

# Banco H2 - servico de livros
spring.datasource.url=jdbc:h2:file:./data/livros-db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Console H2 (acesse em http://localhost:8081/h2-console e coloque o link JDBC URL: jdbc:h2:file:./data/livros-db)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
